name: Verify research platform
on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m compileall -q services ml_training dashboard scripts
      - run: ruff check --select E9,F63,F7,F82 services ml_training dashboard scripts tests
      - run: pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - run: python scripts/configure_local.py
      - run: docker compose config --quiet
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ml-inference, alert-triage, rag-service, feedback-service, correlation-engine, rule-generator, response-orchestrator, wazuh-integration, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
