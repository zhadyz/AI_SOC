<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AI-SOC</title>
<style>body{background:#0d1117;color:#e6edf3;font:16px system-ui;display:grid;place-items:center;min-height:95vh}main{width:min(360px,85vw);padding:36px;background:#161b22;border:1px solid #30363d;border-radius:14px}h1{font-size:25px}p{color:#9ba8b8;line-height:1.6}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font:inherit}button{background:#238636;margin-top:24px;cursor:pointer}.error{color:#ff7b72}</style></head>
<body><main><h1>AI-SOC Command Center</h1><p>Sign in to investigate incidents, review detections and manage response plans.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="64" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required><button type="submit">Sign in</button></form>
<p style="font-size:12px">The local administrator credentials are in the private runtime directory created during setup.</p></main></body></html>
